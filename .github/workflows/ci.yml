name: CI

# Depo 21 Eylul 2026'da GitHub'a tasindi ve hic is akisi yoktu: 841
# dogrulama yalnizca elle calistirilinca kosuyordu.
#
# Burada yeni bir test komutu UYDURULMUYOR. CLAUDE.md "Komutlar" bolumundeki
# test kapisinin aynisi kosuluyor:
#     godot --headless --path . res://tests/testler.tscn
#
# Varsayilan dal 21 Eylul 2026'da master -> main olarak degistirildi
# (dort oyun deposu ayni dal adini kullansin diye).
# Cikis kodu 0 = gecti.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # project.godot: config/features = "4.7". Surum SABIT tutuluyor --
  # "latest" kullanmak, motor guncellenince testlerin bizden habersiz
  # kirmizi yanmasi demek olurdu.
  GODOT_SURUM: 4.7.2-stable
  # Test kapisinin tabani: gecen dogrulama sayisi bunun altina duserse CI
  # kirmizi. Test EKLEYINCE yukselt (README ile birlikte); dusurmek, bir
  # bolumun sessizce kayboldugunu kabul etmek demek.
  TEST_TABANI: 841
  # Bot denetiminin en az kac bolumu "temiz" saymasi gerektigi.
  BOLUM_TABANI: 20

jobs:
  testler:
    runs-on: ubuntu-latest
    # Normal kosu ~1,5 dk. Bir sinama hic donmezse (takili bir await, sonsuz
    # dongu) 6 saatlik varsayilan yerine 15 dakikada kirmizi.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Varliklar Git LFS'te (.gitattributes'ta 4 kural). LFS
          # cekilmezse checkout yalnizca isaretci dosyalari getirir ve
          # sahneler "bozuk kaynak" diye duser.
          lfs: true

      - name: Godot ${{ env.GODOT_SURUM }} indir
        run: |
          set -euo pipefail
          ad="Godot_v${GODOT_SURUM}_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/${ad}.zip"
          unzip -q godot.zip
          chmod +x "$ad"
          sudo mv "$ad" /usr/local/bin/godot
          godot --version

      # Ice aktarma SART ve ayri adim: bayat/eksik .godot onbellegi
      # testin icerigiyle hic ilgisi olmayan "Identifier not declared"
      # ayristirma hatalari uretiyor. Taze checkout'ta .godot hic yok.
      - name: Projeyi ice aktar
        run: godot --headless --path . --import

      # Cikis kodu tek basina yetmiyor: bir test fonksiyonundaki calisma
      # zamani hatasi yalnizca o fonksiyonu keser, kalan dogrulamalar
      # sayilmaz ve takim yine "0 hata" / "TESTLER GECTI" ile 0 doner
      # (25 Eylul 2026'da gercek motorla denendi: 831 dogrulama, cikis 0).
      # tests/kapi.sh gunlugu okuyup sonuc satirini, tabani ve
      # "SCRIPT ERROR" yoklugunu zorunlu kiliyor. Gunluk RUNNER_TEMP'e
      # yaziliyor: calisma agacina yazilsaydi asagidaki "temiz agac" adimi
      # duserdi.
      - name: Testler (en az ${{ env.TEST_TABANI }})
        run: |
          set -o pipefail
          godot --headless --path . res://tests/testler.tscn 2>&1 | tee "$RUNNER_TEMP/test.log"
          bash tests/kapi.sh "$RUNNER_TEMP/test.log" "$TEST_TABANI"

      # Esikler scripts/rota_verisi.gd icinde duruyor ve testler onlari o
      # dosyaya karsi dogruluyor -- yani dosyayi kendisine karsi. Bir bolumun
      # geometrisi degisirse dosya eski kalir, 841 dogrulama yine yesil yanar,
      # ve bolum cozulemez ya da altin ulasilamaz hale gelmis olabilir. Bunu
      # gorebilecek tek sey botu yeniden kosturmaktir; bot zaten burada,
      # yalnizca CI'da hic kosmuyordu.
      #
      # Kosu sayisi 3 (uretim 5): denetimin sorusu "esik tam olarak dogru mu"
      # degil, "bolum bitiyor mu ve altin hala botun ulasabildigi bir sure mi".
      - name: Bolumler hala cozulebiliyor mu (bot, 20 bolum x 3 kosu)
        run: |
          set -o pipefail
          godot --headless --path . res://tools/bot.tscn --fixed-fps 60 -- 3 -1 - denetle 2>&1 | tee "$RUNNER_TEMP/bot.log"
          bash tests/kapi.sh --bot "$RUNNER_TEMP/bot.log" "$BOLUM_TABANI"

      # Denetim dosya yazmamali: yazsaydi CI'da uretilen bir esik sessizce
      # dogru sayilirdi. Calisma agaci temiz kalmali.
      - name: Denetim hicbir dosyayi degistirmedi
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "denetim calisma agacini degistirdi:"
            git status --porcelain
            exit 1
          fi
          echo "calisma agaci temiz"

  referanslar:
    name: Kaynak referanslari saglam mi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Test kapisinin kendi sinamasi: Godot gerektirmez, bu yuzden motoru
      # indirmeyen bu iste. Kapi bozulursa (ornegin SCRIPT ERROR aramasi
      # silinirse) burada kirmizi yanar.
      - name: Test kapisi sinamasi
        run: bash tests/kapi_sinama.sh

      # Kirik bir kaynak referansi motoru her zaman durdurmuyor: eksik bir
      # .tscn ya da silinmis bir .png, sahne o kod yolu calisana kadar
      # sessiz kalabiliyor -- yani testler yesilken de var olabiliyor.
      # Bu kontrol motoru indirmeden, ayni hesaptaki godot-refcheck ile
      # yapiliyor; su an temiz (253 dosya, 75 referans, sifir
      # bulgu) ve bu commit'ten sonra oyle kalmasi garanti.
      - name: godot-refcheck
        uses: Furkiozknn/godot-refcheck@b083e3d2998ca0d5101289b106c76794c6de866d  # v0.2.0 + the clean-project fix
        with:
          path: .
          fail-on: error
          sarif: refcheck.sarif

      - name: SARIF raporunu kod taramaya yukle
        if: always() && hashFiles('refcheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: refcheck.sarif
          category: godot-refcheck
